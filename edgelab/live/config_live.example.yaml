# =============================================================================
# edgelab.live — LIVE / FORWARD-TEST configuration
# =============================================================================
# SAFETY: live_trading:false means the runner sends NO orders. It connects to MT5
# only to PULL BARS (Pepperstone), logs the trades it WOULD place, and paper-tracks
# realised R. Flip live_trading to true ONLY when you have watched the dry-run match
# the backtest for a while and you accept real risk.

live_trading: true           # send orders to MT5. SAFE here: Pepperstone account is a DEMO.
allow_real_account: false    # HARD SAFETY: refuse to send orders if the account is NOT a demo.
pull_real_bars: true         # connect to the MT5 terminal for price data (Pepperstone)
trade_log_csv: edgelab/live/_out/trades.csv   # journal of every entry/exit (forward-test record)

# --- Which MT5 terminal to attach to (REQUIRED on a VPS running several terminals) ---
# Point mt5_path at the PEPPERSTONE terminal so this runner never attaches to another
# terminal (e.g. a MetaQuotes algo's). expect_server makes it REFUSE to trade if it
# somehow lands on the wrong broker. login/password/server make an unattended reconnect
# deterministic (password is a secret — a demo is low-risk; prefer saved creds in the
# terminal + leaving it running, and omit the password here where you can).
# mt5_path: "C:/Program Files/Pepperstone MetaTrader 5/terminal64.exe"
expect_server: Pepperstone          # server name must contain this, else refuse to trade
# mt5_login: 62133658
# mt5_server: PepperstoneUK-Demo
# mt5_password: "..."               # optional; avoid storing if the terminal auto-logs in
# mt5_portable: false               # true if the Pepperstone terminal is a /portable install

# Logical brick symbol -> your Pepperstone MT5 symbol name. VERIFY these against the
# Market Watch in your terminal (crypto/index suffixes vary by broker, e.g. "NAS100.a").
symbol_map:
  NAS100: NAS100
  XAUUSD: XAUUSD
  GER40: GER40          # ajoute 2026-08-18 pour RVWAP
  US30: US30            # ajoute 2026-08-18 pour RSKEW
  BTCUSD: BTCUSD
  ETHUSD: ETHUSD
  US500: US500          # 2e symbole de TLF

# which symbol each brick trades
nas_symbol: NAS100
gold_symbol: XAUUSD
crypto_symbols: [BTCUSD, ETHUSD]
# ⚠️ METTRE `crypto_symbols: []` POUR RETIRER LA BRIQUE 3. C'est un RETRAIT (le runner
# n'instancie plus aucune CryptoMacdStrategy, magics 103/104 non pilotes), pas un
# dimensionnement a zero. Mesure du 2026-08-18 : nette des couts FTMO sur 2018-07 ->
# 2026-07 la brique 3 rend +0.2 R/an pour 21.3 R de drawdown (RoMaD 0.01, le plus bas
# des six sleeves). La retirer coute -0.3 R/an et rend maxDD 19.0 -> 18.6 R, pire mois
# -13.5 -> -10.4 R, P(valider)@1 % 89.0 -> 90.2 %, ruine funded@0,5 % 5.4 -> 4.1 %.
# ⚠️ Les positions BTC/ETH deja ouvertes ne sont PAS fermees par ce changement.

# Fraction de 1R risquee par trade de la BRIQUE 3 (crypto). Defaut du code = 1.0.
# Ramenee a 0.5 le 2026-08-10 : le swap FTMO sur BTCUSD/ETHUSD vaut -30 %/an sur LES DEUX
# COTES (verifie sur le terminal), soit 5.71 R/an, contre 5.72 R/an de brut encore gagnes
# depuis juillet 2022 -> contribution NETTE +0.01 R/an sur 4 ans. A 0.5R la ruine funded du
# livre passe de 60.7 % a 49.2 % (MC periode recente, 1 %/trade).
crypto_size_R: 0.5
ibs_symbol: NAS100             # brick 4 (IBS reversion) — same instrument as brick 1, distinct
                               # mechanism & magic (105); the two never share a position.
enable_ibs: true               # set false to run the old 3-brick book

# ---- HMASTO forward-test sleeve (NOT a brick) ------------------------------
# NAS100 M15 HMA(12)/EMA(5)[2] crossover confirmed by RSI(14) + two smoothed stochastics
# (edgelab/intraday/hma_stoch.py, added 2026-08-10). The only NON-breakout survivor of the
# corpus campaign, which is why it is not redundant with brick 1 (corr +0.133) nor with
# brick 4 / IBS on the same underlying (corr -0.148).
# Default OFF so a plain checkout keeps trading the frozen 4-brick book.
# HALF SIZE is deliberate, exactly as KAER was: +HMASTO@0.5R improves the book while @1R
# raises maxDD 17.16 -> 23.93 and lowers RoMaD.
# It trades ~256x/yr — far more than any brick — so watch the journal, not just the P&L.
# ⚠️ mono-asset, in-sample, best of 112 by RoMaD on the asset where the campaign's
# selection pressure is strongest. Forward test, not a promotion. Do not size it up.
enable_hmasto: false
hmasto_symbol: NAS100
hmasto_size_R: 0.5             # fraction of 1R risked per HMASTO trade
hmasto_bars: 400               # M15 bars pulled (needs ~60 for the HMA/RSI/stoch warmup)
hmasto_max_bar_age_min: 5      # skip (do not chase) a signal bar older than this

# ---- TLF forward-test sleeve (NOT a brick) ---------------------------------
# TLF = Two-Leg Fade. M5, SHORT-ONLY, NAS100 (magic 109) + US500 (magic 110).
# La SELECTION DES BARRES vient d'Al Brooks (contexte always-in ch.19 + repli a DEUX
# jambes ch.20 + signal bar FORTE ch.5). La DIRECTION est l'INVERSE de la sienne : sur les
# memes barres, sa direction rend +0.106 R/trade quand tout prendre en SHORT rend +0.128.
# Contre 120 tirages apparies : selection de barres +0.113 R (108 % de l'edge, p=0.000),
# direction du signal -0.022 R (-22 %). D'ou le nom, et surtout PAS "Brooks".
#
# ENTREE SUR ORDRE STOP, comme le backtest valide : SELL STOP a "plus-bas de la signal bar
# - 1 tick", vivant la barre suivante SEULEMENT. L'ordre est annule PAR LE DRIVER a la
# barre d'apres (one_bar_expiry), jamais par une expiration broker (granularite = minute,
# elle ne sait pas exprimer "une barre M5"). 1R est RE-ANCRE sur le fill (modify_sl) :
# l'ordre porte SL = trigger + 1R, mais si le prix a gappe a travers le trigger le
# backtest mesure 1R depuis le FILL. Profil : n=1357, E[R] +0.1275, +20.22 R/an,
# t_jours +3.04. ~42-44 % des ordres armes sont remplis, le reste EXPIRE -> le journal
# montre beaucoup plus d'ordres que de trades, c'est normal.
#
# ⚠️ FORWARD TEST, PAS UNE PROMOTION. Reserves serieuses : retirer 2020 ET 2022 -> t=+1.77
# (52.6 % de son R vient de ces deux annees) ; l'echelle de detection n'est PAS monotone
# (M5 +3.05, M10 -1.54, M15 +0.91, M30 +0.34) ; ne sort pas des indices US (2/13 actifs a
# t>2) ; conjonction fragile (retirer les jambes -> +0.13, l'always-in -> +0.10, leg 3 ->
# -0.63) ; direction retournee A POSTERIORI sur 2 709 cellules. Ne pas augmenter la taille.
# Voir edgelab/intraday/two_leg_fade.py.
enable_tlf: false            # true sur la demo ; false par defaut
tlf_symbols: [NAS100, US500]
tlf_size_R: 0.5              # fraction de 1R risquee par trade TLF
tlf_bars: 600                # barres M5 tirees (min 300 : WARMUP 250 + EMA20/ATR14)
tlf_max_bar_age_min: 2       # barre de signal plus vieille que ca -> on ne chasse pas

# ---- KAER — REPLACED by HMASTO on 2026-08-10 (do not re-enable) -------------
# NAS100 M15 Kaufman efficiency-ratio breakout (edgelab/intraday/kaer.py, added
# 2026-08-07, retired from the live wiring 2026-08-10). KAER and HMASTO are the SAME
# family — same asset, same timeframe, corr +0.335 monthly — so they are alternatives,
# never a pair: net of FTMO costs, running BOTH takes the book's maxDD 17.16 -> 20.29,
# while swapping gains +5.90 R/yr for a maxDD that does not degrade. HMASTO also
# dominates KAER standalone (net R/yr +42.62 vs +30.82) and its two half-samples GROW
# where KAER's decay. The runner IGNORES this flag with a warning; the module and its
# `verify` check are kept for research. See wiki/log.md 2026-08-10.
enable_kaer: false

# ---- KELT forward-test sleeve (NOT a brick) --------------------------------
# BTCUSD H1 Keltner-band breakout (edgelab/intraday/keltner_btc.py, added 2026-08-08).
# NOT a 5th brick: monthly corr to brick 3 is +0.07..+0.23 — a SECOND crypto-trend sleeve
# (hourly cousin of the daily MACD), hence half size. Default OFF.
# The 25x-spread floor is part of the RULE, not a tuning knob: 1R = max(3*ATR14,
# 25*spread). Without it the sleeve's R/yr is inflated by 57% on trades whose stop is
# barely wider than the spread (the ledger's crypto post-mortem).
# ⚠️ It shares BTCUSD with brick 3 under its own magic (107). That requires a HEDGING
# account — on a NETTING account the two positions would offset. Check with
# mt5.account_info().margin_mode == 2 before enabling.
#
# ⛔ RETIRED FROM THE LIVE BOOK 2026-08-09 — this flag is now INERT (runner.py no longer
# registers the strategy; it logs a warning if the flag is true). Reason: FTMO charges
# -30 %/yr on BOTH sides of BTCUSD (MT5 "percentage of current price" = ANNUAL interest,
# 360-day bank year -> 8.33 bps/night). Swap cost in R = nights x rate / stop_pct, so a
# sleeve with a 2.95 % stop held 2.1 nights, 153 times a year, pays 8.60 R/yr: the sleeve
# nets +5.00 R/yr at t=0.87. Removing it lowers AGRESSIF's maxDD 21.7->17.3 R and cuts
# FUNDED's ruin 2.4 %->0.7 %. See wiki/system.md and wiki/log.md 2026-08-09.
enable_keltner: false
kelt_symbol: BTCUSD
kelt_size_R: 0.5               # fraction of 1R risked per Keltner trade
kelt_bars: 600                 # H1 bars pulled (needs ~250 warmup for ATR20/ATR14)
kelt_max_bar_age_min: 20       # skip (do not chase) a signal bar older than this

# ---- risk / prop rules (static-DD firm) ------------------------------------
# risk_per_trade is a FRACTION of the account, NOT an amount in euros:
#     1R (in €) = risk_per_trade * balance      (fixed-fractional, NO compounding)
# With size_from_account:true the balance is the REAL account read at startup, so on a
# 60 000 € account 0.01 = 1R of 600 €. To change the euro risk, change this fraction (or
# the account size) — NEVER put an absolute euro value here (0.01 = 1%, but 600 = 60000%).
# Recommended: 1.00% to PASS the challenge, drop to 0.50% once funded (see wiki/system.md).
risk_per_trade: 0.01
# When the ideal size is below the broker's MINIMUM lot, the position is forced up to that
# minimum and then risks MORE than 1R (e.g. NAS100 on a small account: 0.1 lot ~= 1.6R).
# max_risk_R caps this: the over-risk is always logged; past this many R the entry is SKIPPED
# (the account is too small to size that stop to 1R). 1.25 = take up to 1.25R, skip beyond.
max_risk_R: 1.25
# size_from_account:true (default) bases 1R on the ACTUAL connected balance at startup
# -> avoids the dangerous mismatch where initial_balance below is 10x the real demo
# balance. Set false to use propfirm.initial_balance verbatim (a real fixed-size
# challenge where the nominal account size is known and fixed).
# ⚠️ NE CONCERNE QUE LE SIZING depuis le 2026-08-12. Les PLANCHERS prop ne se basent plus
# la-dessus : ils vivent sur challenge_start_balance ci-dessous (ou, a defaut, sur
# _out/account_start.json). Avant ce correctif ils suivaient le solde, donc une
# reconnexion MT5 en plein drawdown reposait le plancher -10 % plus bas.
size_from_account: true
propfirm:
  initial_balance: 100000.0     # only used if size_from_account:false
  # Solde de DEPART du challenge -> la reference du pourcentage publie par le rapport
  # Discord quotidien ("+x% de l'objectif +15%"). A NE PAS confondre avec initial_balance
  # ci-dessus, qui ne sert qu'au sizing : avec size_from_account:true celui-ci est ecrase
  # par le solde lu AU DEMARRAGE du runner, donc mesurer la progression du challenge
  # contre lui la mesure depuis le dernier redemarrage (bug signale le 2026-08-12 :
  # "+0.31% de +15%" alors que le journal etait a -0.14 R).
  # Laisse commente -> le runner pose l'ancre lui-meme dans _out/account_start.json au
  # premier passage et n'y retouche jamais ; le rapport publie alors la date de l'ancre.
  # Renseigne-le des que la vraie valeur nominale du challenge est connue.
  # challenge_start_balance: 60000.0
  max_daily_loss_pct: 0.05
  max_total_drawdown_pct: 0.10
  profit_target_pct: 0.15
  min_trading_days: 5
  consistency_max_day_share: null
  drawdown_basis: initial       # STATIC drawdown (floor fixed at 90% of initial)

# ---- runner cadence --------------------------------------------------------
poll_seconds: 20               # loop period; brick 1 needs sub-minute polling near the US open
# Bricks 2, 3 & 4 decide at the broker DAILY-BAR ROLLOVER (00:00 server time) so live
# enters at the bar open / exits at the bar close = matches the backtest (no intraday lag).
# daily_decision_et is no longer used (kept only for backward compatibility).
daily_decision_et: "09:45"
# How long a rollover brick (2, 3, 4) may keep retrying an entry that fails ON AN OPEN
# MARKET before it gives up and skips the day. Past this, a fill would land hours away
# from the rollover and would no longer be the trade the backtest measured.
# It does NOT bound waiting for a CLOSED market: retcode 10018 and "today's bar has not
# printed yet" never start the clock, so a signal validated at Friday's close is still
# taken at the Sunday-night reopen (~48 h later) — that reopen IS the backtest's fill.
entry_retry_max_hours: 2

# How many minutes BEFORE the 00:00-server daily rollover a D-bar TIME EXIT is sent
# (bricks 2, 3, 4 and KELT's 96-bar cap). An exit fired AT the rollover goes into the
# daily maintenance break — NAS100 and XAUUSD are both shut 00:00-01:00 server — so it is
# rejected 10018 and fills at the reopen, which on a Friday is MONDAY. That is how a
# sleeve ends up carrying a weekend it never agreed to (13% of brick 2's exits, 20% of
# brick 4's). 10 = 23:50 server = 22:50 Paris.
# ⚠️ DO NOT SET THIS TO 5. Mon-Thu these symbols quote through 23:55 server, but on FRIDAY
# the session ends AT 23:55 (last M5 bar 23:50) — a 5-minute lead would fire exactly on
# the Friday close, the one day the weekend is at stake. 10 is the last window that is
# live every day of the week. Crypto (BTCUSD/ETHUSD) has no break at all, so there the
# lead is insurance rather than a fix.
rollover_lead_min: 10

# ---- auto-update from GitHub (no more manual file copies on the VPS) --------
# Needs the folder to be a git clone of the repo + git installed. Every
# update_check_min the runner compares to origin/main; if newer, it exits and the
# supervisor (run_forever.ps1) git-pulls + relaunches, rolling back if the new code
# fails to import. config_live.yaml is gitignored -> never overwritten.
auto_update: true
update_check_min: 30           # how often (minutes) to check GitHub for a new commit

# ---- daily Discord heartbeat report ----------------------------------------
# The runner posts a summary once a day. Paste your Discord webhook URL to enable
# (empty = off). Create one in Discord: Server Settings > Integrations > Webhooks.
#
# ⚠️ CE RAPPORT NE PROUVE PAS LA VIE EN SEANCE, et c'est un piege verifie le 2026-08-17 :
# il tombe a `daily_report_et` (17:00 ET), soit UNE HEURE APRES la cloture US. Les
# rapports du 15 et du 16/08 sont partis normalement alors que le runner avait manque
# TOUTE la seance du 14/08 puis la premiere heure de celle du 17/08. Un runner qui meurt
# a l'ouverture et qu'on relance a 17:01 envoie un rapport parfaitement rassurant.
# La liveness AU REPOS et la liveness EN SEANCE sont deux proprietes distinctes ->
# voir le bloc `liveness_*` ci-dessous, qui surveille la seconde.
discord_webhook_url: ""        # e.g. https://discord.com/api/webhooks/XXXX/YYYY
daily_report_et: "17:00"       # time of day (ET) to send the report

# ---- alertes de sante EN SEANCE (ajoutees 2026-08-17) -----------------------
# Toutes ces cles ont un defaut dans le code (runner.py), donc ce bloc est OPTIONNEL :
# ne le renseigner que pour changer les seuils. Deux alertes, sur le meme webhook :
#
#  1. SCAN EN RETARD. Pendant la seance US seulement (calendrier `us_session_calendar`,
#     donc feries et demi-seances exclus), le runner compare `_acted_bar` de chaque sleeve
#     scannante a l'heure courante. `_acted_bar` est mis a jour meme quand le scan ne
#     trouve rien (et meme sur un skip pour barre perimee), donc ce retard mesure LA
#     BOUCLE, pas le signal. Le seuil suit l'UT de la sleeve — `max(liveness_lag_alert_min,
#     UT + liveness_margin_min)` — parce que l'age de la derniere barre close cycle
#     naturellement de 0 a UT : un seuil fixe hurlerait en continu sur une sleeve H1.
#     Deux faux positifs sont exclus par construction, tous deux vus a la premiere mise en
#     service le 2026-08-17 : une sleeve qui PORTE une position ne scanne pas (son step()
#     part par la gestion de position et ne touche pas `_acted_bar`), et un processus qui
#     vient de demarrer a legitimement `_acted_bar = None` -- la grace se compte donc
#     depuis le DEMARRAGE, pas depuis l'ouverture de la seance.
#  2. REDEMARRAGE EN PLEINE SEANCE, avec la duree du trou lue dans le heartbeat de
#     l'instance precedente. Un demarrage est le seul evenement qu'un processus est SUR de
#     pouvoir signaler : les cinq morts du 13 au 17/08 n'ont laisse aucune ligne d'arret,
#     ni cote runner ni cote superviseur. Une relance SANS trou (< startup_alert_min_gap_min)
#     n'est pas un incident et reste dans le log, sans Discord.
liveness_lag_alert_min: 20     # plancher du seuil de retard de scan (minutes)
liveness_margin_min: 5         # marge ajoutee a l'UT de la sleeve pour former le seuil
liveness_alert_cooldown_min: 60  # pas plus d'une alerte de retard par heure
liveness_grace_min: 20         # tolerance APRES LE DEMARRAGE avant de juger un "jamais scanne"
startup_alert_min_gap_min: 2   # en dessous de ce trou, la relance n'est pas annoncee

# Pre-session heads-up pings (~1h before the bricks trade). All 3 bricks act in the US
# morning window: brick 1 at the 09:30 ET open, bricks 2 & 3 at the 09:45 ET decision.
# Each entry fires once/day at its ET time. Add/edit freely (times are New York time).
pre_session_alerts:
  - et: "08:30"
    msg: "In ~1h: NAS100 breakout window opens (09:30 ET) + gold turn-of-month & crypto MACD decision (09:45 ET)."

# ---- live order plumbing (only used when live_trading:true) ----------------
deviation_points: 20
filling: ORDER_FILLING_IOC
paper_balance: 100000.0        # dry-run starting balance for the P&L log

# ---- RVWAP / RSKEW : les deux sleeves issues de research/ (2026-08-18) -------
#   RVWAP  GER40 H1, magic 111 : distance au VWAP ancre a la session NY, en ATR.
#          L'IC mesure est NEGATIF, donc la sleeve SUIT l'ecart au lieu de le fader.
#          Sortie a 24 barres H1 ou au stop ; 1R = 3.0 x ATR14.
#   RSKEW  US30 H4, magic 112 : asymetrie des 50 derniers log-rendements, IC POSITIF.
#          Sortie a 5 barres H4 ou au stop ; 1R = 4.0 x ATR14.
#
# PARITE PROUVEE le 2026-08-18 (`python check_live_parity_research.py`) : le rejeu en
# fenetre tronquee, comme MT5 sert les barres, contre le backtest complet donne **0 ecart**
# sur les dates d'entree, les dates de sortie, le sens, 1R et R -- 400 trades chacune,
# ecart maximal 0.000e+00. La parite tient parce que le scan live et le backtest appellent
# LA MEME fonction (`research_sleeves.decide`).
#
# ⚠️ LA TAILLE DE FENETRE N'EST PAS UN DETAIL. Le rang causal d'entree porte sur les 1 000
# dernieres OCCURRENCES du signal. Le VWAP n'existant qu'aux ~6,5 h de session NY, il faut
# ~3 700 barres H1 pour en reunir 1 000 : d'ou 5 000. Une fenetre trop courte ne leve
# AUCUNE erreur -- elle rend un rang DIFFERENT, donc des entrees differentes du backtest.
# Le harnais de parite mesure la marge (1.47x pour RVWAP, 1.45x pour RSKEW au 2026-08-18)
# et echoue sous 1.0x.
#
# ⚠️⚠️ IN-SAMPLE, SANS AUCUN FORWARD-TEST. Tirees d'une grille de 28 300 cellules d'IC puis
# d'un balayage de 2 595 geometries de sortie. KAER, HMASTO et TLF sont toutes entrees a
# 0,5R AVANT d'etre jugees, et HMASTO a ete retiree de FUNDED pour avoir echoue son seul
# hors-echantillon. Le 1R ci-dessous est une INSTRUCTION UTILISATEUR du 2026-08-18, pas une
# conclusion de mesure. Juger sur le journal de trades, pas sur le P&L.
enable_research_sleeves: false   # true sur la demo ; false par defaut
rvwap_symbol: GER40
rvwap_size_R: 1.0
rvwap_bars: 5000             # ~1 470 occurrences du signal, pour 1 000 requises
rvwap_max_bar_age_min: 20
rskew_symbol: US30
rskew_size_R: 1.0
rskew_bars: 1500             # ~1 450 occurrences, pour 1 000 requises
rskew_max_bar_age_min: 60
